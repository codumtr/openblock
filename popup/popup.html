<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenBlock Kalkanı</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Başlık & Logo -->
    <header class="header">
      <div class="logo-box">
        <img src="../icons/icon32.png" alt="OpenBlock" class="logo-icon">
        <div class="logo-text">
          <h1>OpenBlock</h1>
          <span class="version-badge">v1.0 MIT</span>
        </div>
      </div>
      <a href="../options/options.html" target="_blank" class="icon-btn" title="Ayarlar" id="btnSettings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </header>

    <!-- Ana Güç Butonu -->
    <div class="power-section">
      <button class="power-button active" id="powerBtn" title="Korumayı Aç/Kapat">
        <svg class="power-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
      </button>
      <div class="domain-info">
        <span class="status-indicator active" id="statusIndicator">KORUMA AKTİF</span>
        <span class="domain-name" id="domainName">example.com</span>
      </div>
    </div>

    <!-- İstatistik Kartları -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-value" id="pageBlockedCount">0</span>
        <span class="stat-label">Bu Sayfada</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="totalBlockedCount">0</span>
        <span class="stat-label">Toplam Engellenen</span>
      </div>
    </div>

    <!-- Hızlı Ayarlar -->
    <div class="quick-settings">
      <div class="setting-row">
        <div class="setting-info">
          <span class="setting-title">Kozmetik Filtre</span>
          <span class="setting-desc">Boş reklam kutularını gizler</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleCosmetic" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <span class="setting-title">Anti-AdBlock Kalkanı</span>
          <span class="setting-desc">"Engelleyiciyi kapatın" uyarılarını aşar</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleAntiAdblock" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Alt Bilgi -->
    <footer class="footer">
      <a href="https://github.com" target="_blank" class="github-link" id="githubLink">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>Açık Kaynak (MIT)</span>
      </a>
      <span class="refresh-tip" id="reloadTip">Sayfayı yenileyin</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
